    <style>
        /* Custom Styling Root Properties */

            --bg-main: #0B0F19;
            --bg-card: #151D30;

    </style>

<body>

    <main class="portfolio-container">
    </main>

    <script>
        // Dynamic content Loader targeting Vercel Serverless Functions
        async function loadData() {
            try {
                // Aligned path to ensure routing triggers your vercel.json rewrite rules
                const res = await fetch('/api/data');
                if (!res.ok) throw new Error('Network response failure');
                const s = await res.json();

                if (s) {
                    // Profile & Identity mapping
                    if (s.avatar) {
                        const avatarImg = document.getElementById('avatar-img');
                        if (avatarImg) avatarImg.src = s.avatar;
                    }

                    // Site Logo updating
                    if (s.site_logo) {
                        const favicon = document.querySelector('link[rel="icon"]');
                        if (favicon) favicon.href = s.site_logo;
                    }

                    // CV download link structural setup
                    if (s.cv_url) {
                        ['cv-link', 'cv-download-btn'].forEach(id => {
                            const el = document.getElementById(id);
                            if (el) {
                                el.href = s.cv_url;
                                el.style.display = 'inline-block';
                                el.setAttribute('download', '');
                            }
                        });
                    }
                }
            } catch (e) {
                console.error('loadData execution error:', e);
            }
        }

        // Initialize data retrieval
        loadData();

        // Contact Form Event Handler
        document.getElementById('contact-form').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = e.target.querySelector('.submit-btn');
            const notice = document.getElementById('form-notice');

            btn.textContent = 'Sending...';
            btn.disabled = true;
            notice.className = 'form-notice';

            try {
                const fd = new FormData(e.target);
                // Explicit endpoint hitting Vercel's Node runtime via rewrite mapping
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(fd))
                });

                const data = await res.json();
                if (data.success) {
                    notice.className = 'form-notice ok';
                    notice.textContent = 'Message sent! I will get back to you soon.';
                    e.target.reset();
                } else {
                    notice.className = 'form-notice err';
                    notice.textContent = data.error || 'Failed to transmit message.';
                }
            } catch (err) {
                notice.className = 'form-notice err';
                notice.textContent = 'Network error. Please try again later.';
            } finally {
                btn.textContent = 'Send Message';
                btn.disabled = false;
            }
        });
    </script>
</body>
